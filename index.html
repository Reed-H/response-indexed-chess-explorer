<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Response Indexed Opening Explorer</title>
  <link rel="stylesheet" href="./js/chessboard.css" />
  <link rel="stylesheet" href="./css/explorer.css" />
</head>
<body>
  <header class="topbar">
    <button id="menu-btn" class="icon-btn" type="button">☰</button>
    <h1>Response Indexed Opening Explorer</h1>
  </header>

  <aside id="side-menu" class="side-menu hidden">
    <div class="menu-head">Settings</div>
    <div class="menu-profile">👤 Profile/Login (placeholder)</div>
    <button id="settings-btn" class="btn btn-secondary" type="button">Open Display Settings</button>
  </aside>

  <div id="breadcrumb"></div>

  <div id="workspace">
    <section id="left-panel">
      <div id="board-section">
        <div id="board-shell">
          <div id="board"></div>
          <div id="engine-lines-overlay" class="hidden"></div>
        </div>
        <div id="eval-bar-container"><div id="eval-bar"></div></div>
      </div>

      <div id="controls-section">
        <h3>Add Variation</h3>
        <div class="input-group">
          <label>Selected Move:</label>
          <span id="selected-move-display" class="selected-move-display">None</span>
          <button id="undo-move-btn" class="btn btn-secondary" type="button">Undo Move</button>
        </div>
        <div class="input-group">
          <label><input type="checkbox" id="show-legal-toggle" checked /> Show legal moves</label>
          <label><input type="checkbox" id="auto-navigate-toggle" checked /> Auto navigate after Add Variation</label>
        </div>
        <div class="input-group">
          <label for="white-response-input">White strategy:</label>
          <input type="text" id="white-response-input" maxlength="50" />
          <button class="mini-picker" id="strategy-picker-btn" type="button">▾</button>
        </div>
        <div id="strategy-picker" class="pill-panel hidden"></div>
        <div class="input-group">
          <label for="line-tag-input">Line tag:</label>
          <input type="text" id="line-tag-input" maxlength="50" />
          <button class="mini-picker" id="tag-picker-btn" type="button">▾</button>
        </div>
        <div id="tag-picker" class="pill-panel hidden"></div>
        <div class="input-group">
          <button id="add-variation-btn" class="btn btn-primary">Add Variation</button>
          <button id="back-btn" class="btn btn-secondary">← Back</button>
          </div>

        <h3>Import / Export</h3>
        <div class="input-group"><textarea id="import-json-input" rows="4" placeholder="JSON tree, lines (FEN | SAN SAN...), or PGN"></textarea></div>
        <div class="input-group">
          <button id="import-json-btn" class="btn btn-secondary" type="button">Import JSON</button>
          <button id="import-lines-btn" class="btn btn-secondary" type="button">Import Lines</button>
          <button id="import-pgn-btn" class="btn btn-secondary" type="button">Import PGN</button>
          <button id="export-btn" class="btn btn-secondary" type="button">Export JSON</button>
          <button id="export-subtree-btn" class="btn btn-secondary" type="button">Export Section JSON</button>
          <button id="export-png-btn" class="btn btn-secondary" type="button">PNG</button>
          <button id="export-jpeg-btn" class="btn btn-secondary" type="button">JPEG</button>
          <button id="export-pdf-btn" class="btn btn-secondary" type="button">PDF</button>
        </div>
        <div id="status-message" class="status-message"></div>
      </div>

      <div id="tree-panel">
        <h3>Move Variations</h3>
        <div class="tree-view-controls">
          <label><input type="checkbox" id="grouping-toggle" checked /> Grouped</label>
          <label><input type="checkbox" id="clustering-toggle" checked /> Cluster</label>
          <label>Top-N <select id="cluster-topn"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select></label>
          <label>Black <select id="black-filter"><option value="">All</option></select></label>
          <label>White <select id="white-filter"><option value="">All</option></select></label>
        </div>
        <div id="variations-container"></div>

        <h3>Tree (JSON View)</h3>
        <div id="tree-json-container"></div>
      </div>
    </section>

    <div id="panel-resizer" title="Drag to resize"></div>

    <section id="right-panel">
      <div id="board-tree-section">
        <div class="section-header">
          <h3>Position Tree</h3>
          <div class="tree-actions">
            <label>Align <select id="tree-align"><option value="left" selected>Left</option><option value="center">Center</option><option value="pyramid">Pyramid</option></select></label>
            <label>Spacing X <input id="node-spacing-x" type="range" min="130" max="280" value="190" /></label>
            <label>Spacing Y <input id="node-spacing-y" type="range" min="130" max="260" value="190" /></label>
            <label>Last move <select id="last-move-style"><option value="squares" selected>Squares</option><option value="arrows">Arrows</option></select></label>
            <label>Highlight mode <select id="line-highlight-mode"><option value="full" selected>Full color</option><option value="line">Line highlight</option><option value="tags">Tag colors</option></select></label>
            <label>Wheel <select id="wheel-mode"><option value="scroll" selected>Vertical scroll</option><option value="zoom">Scroll to zoom</option></select></label>
            <button id="center-tree-btn" class="btn btn-secondary" type="button">Center</button>
            <button id="collapse-left-btn" class="btn btn-secondary" type="button">Collapse Live Panel</button>
          </div>
        </div>
        <div id="board-tree-viewport"><div id="board-tree-canvas"></div></div>
      </div>
    </section>
  </div>

  <dialog id="settings-dialog">
    <form method="dialog" class="settings-form">
      <h3>Display Settings</h3>
      <label>Theme <select id="theme-select"><option value="light" selected>Light</option><option value="dark">Dark</option></select></label>
      <label>Tree background <input type="color" id="tree-bg-input" value="#f4f6f8" /></label>
      <label>Board colors <select id="board-theme-select"><option value="classic" selected>Classic</option><option value="green">Green</option><option value="blue">Blue</option></select></label>
      <label>Eval fill color <input type="color" id="eval-fill-input" value="#f3e7c9" /></label>
      <label>Eval background <input type="color" id="eval-bg-input" value="#2f2f2f" /></label>
      <label><input type="checkbox" id="engine-lines-toggle" /> Show top engine lines</label>
      <button id="close-settings-btn" class="btn btn-secondary" type="button">Close</button>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="./js/jquery.js"></script>
  <script src="./js/chessboard.js"></script>
  <script type="module" src="./js/app-multi-node.js"></script>
</body>
</html>
